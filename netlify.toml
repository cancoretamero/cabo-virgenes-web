[build]
  publish = "."
  command = "echo 'No build step - static site'"
  functions = "netlify/functions"
  ignore = "/bin/false"

[build.environment]
  NETLIFY_USE_YARN = "false"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ── Endpoints bonitos /api/* → Netlify Functions ──────────────────────────
[[redirects]]
  from = "/api/chatbot"
  to = "/.netlify/functions/chatbot"
  status = 200
[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
[[redirects]]
  from = "/api/subscribers"
  to = "/.netlify/functions/subscribers"
  status = 200
[[redirects]]
  from = "/api/consultas"
  to = "/.netlify/functions/consultas"
  status = 200
[[redirects]]
  from = "/api/newsletters"
  to = "/.netlify/functions/newsletters"
  status = 200
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
